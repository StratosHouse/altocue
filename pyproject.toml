[project]
name = "altocue"
version = "0.5.0"
description = "The AI edit suite for coding agents: footage, a long recording or a brief in, a finished and checked video out."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Stratos House" }]
keywords = ["video", "video-editing", "claude-code", "claude-code-plugin", "codex", "agent-skills", "mcp", "mcp-server", "ffmpeg", "captions", "motion-graphics", "launch-video", "subtitles"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Video :: Non-Linear Editor",
]
dependencies = [
    "numpy>=2.0",
    "pillow>=11",
    "opencv-python-headless>=4.10",
    "parakeet-mlx>=0.5.3,<0.6; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "faster-whisper>=1.2.1,<2; sys_platform != 'darwin' or platform_machine != 'arm64'",
]

[project.optional-dependencies]
parakeet = ["parakeet-mlx>=0.5.3,<0.6; sys_platform == 'darwin' and platform_machine == 'arm64'"]
mlx-whisper = ["mlx-whisper>=0.4.3,<0.5; sys_platform == 'darwin' and platform_machine == 'arm64'"]
faster-whisper = ["faster-whisper>=1.2.1,<2"]
speakers = ["sherpa-onnx>=2.0.1,<3"]

[project.urls]
Homepage = "https://www.stratosagency.ai/altocue"
Repository = "https://github.com/StratosHouse/altocue"
Changelog = "https://github.com/StratosHouse/altocue/blob/main/CHANGELOG.md"
Issues = "https://github.com/StratosHouse/altocue/issues"

[project.scripts]
altocue = "altocue.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8", "pyright>=1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/altocue"]
exclude = ["src/altocue/data/renderer/node_modules"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "altocue/data/skills"  # so `altocue mcp` from PyPI can serve the same guides the plugin carries

[tool.hatch.build.targets.sdist.force-include]
"skills" = "skills"  # .agents/skills links here; without this the source package keeps only the link and the wheel build fails

[tool.ruff]
line-length = 170
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/altocue/motion/html.py" = ["E501"]
"src/altocue/motion/formats/*.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs real models or real footage", "network: needs a provider key"]
addopts = "-m 'not slow and not network'"
tmp_path_retention_count = 1
tmp_path_retention_policy = "failed"  # renders in tests are large, and this disk also holds swap
