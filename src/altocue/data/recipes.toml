# Hosted workflows. Load each one by name. Three of these names look like slash
# commands in the tool description and do not resolve: the server answers with its
# unknown-token fallback, the agent carries on with ordinary generation, and the
# workflow's truth gate is gone without a word.

[[recipe]]
id = "ugc-video"
title = "Generated host film"
group = "workflow"
command = "ugc-video"
makes = "Finishes a short vertical film with a generated host: a demo, unboxing, try-on, tutorial or website walk-through."
when = "A demo is needed and no presenter can be filmed. The host shows and explains. The host is never a customer."
inputs = ["a product photo", "an approved claims list, or a script of only what can be seen", "a length of 4 to 30 s"]
limits = "A generated host may not say they bought, used or got results. QA turns that into FIX, and a label does not cure it."
enters_at = "source"
tool = "generate_image, generate_video"
loader = "get_workflow_instructions"
load = "ugc-video"
slash_trap = true
variants = ["review", "product", "unboxing", "try-on", "tutorial", "website"]
synthetic = ["person", "voice"]
truth_gate = true
uploads_footage = true
sends = "your product photos, and any reference images"
basis = "estimate"
as_of = "2026-10-08"
fixed_credits = 9.12
per_second = { "480p" = 3, "720p" = 7, "1080p" = 12 }
cost_note = "Creator 0.12, board 6.5 and clean-up 2.5, plus the clip at the seedance_2_5 rate. Before any retries."
fallback = "fal:bytedance/seedance-2.0/reference-to-video"
fallback_checked = "2026-10-30"
fallback_note = "Same rules, built by hand from fal stills and the Seedance 2.0 reference route in models.toml. No hosted truth gate, so the skill's own applies."

[[recipe]]
