inputs = ["a still or clip", "reference stills or a named look"]
limits = "Colour only: it cannot move light or make day into night. SDR in. A LUT carries only the per-pixel transform, not the skin or sky masks, glow or grain."
enters_at = "finish"
tool = "sandbox_exec"
loader = "get_preset_instructions"
load = "/color-grade"
uploads_footage = true
sends = "the clip and the reference stills, to Higgsfield's sandbox"
basis = "stated"
as_of = "2026-11-07"
fixed_credits = 0
cost_note = "Its own text says no paid generation is needed. The upload still needs the project's yes."
fallback = "native:altocue grade"
fallback_note = "Altocue's grade stage corrects and applies its own looks without any upload."

