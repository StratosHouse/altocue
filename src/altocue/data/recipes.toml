# Altocue recipe catalog. One entry per useful hosted command, so an agent can see
# what a command makes, what it costs and what leaves the machine before it runs one.
#
# Written in our own words. Nothing here is copied from Higgsfield's hosted workflow
# bundle or its skill text. The hosted bundle carries no licence we could find, so
# its prompts and scripts never belong in this repo. Command names are facts, and
# they are recorded so an agent can find them.
#
# Read from the Higgsfield MCP server on 2026-11-02, without spending. Rechecked on
# 2026-11-07 after the account's access grew: /shorts became a full presenter-reel
# workflow, and /color-grade, /microdrama-ads and the Shorts Studio gallery appeared.
#
# Cost fields:
#   basis          quote     a live quote from the provider's own tool
#                  stated    the provider's own text says so, with no quote run
#                  observed  seen on a real run, which may be a single sample
#                  estimate  a planning figure from a dated price file
#                  unknown   no figure found. Never invent one
#   as_of          the date of that figure, or of the check that found none
#   fixed_credits  paid once per job
#   per_second     credits a second, by resolution
#   each_credits   credits per `each_unit`
#
# Upload fields:
#   uploads_footage  true when the job needs the project's own media on Higgsfield.
#                    These refuse until the project runs
#                    `altocue generate --allow-upload higgsfield`.
#   sends            what goes, in plain words
#
# Fallback, for a user with no Higgsfield account:
#   none             say so plainly
#   fal:<model>      a fal.ai model, checked against its page on `fallback_checked`
#   format:<id>      a native motion format in src/altocue/motion/formats
#   native:<cmd>     an Altocue stage that does the job
#
# `excluded` keeps a recipe out of `altocue recipes list` and refuses it at quote,
# reserve and import. The entry stays so an agent knows why it was left out.

schema = 1

# Reel effects. They read a vertical talking clip and render at the spoken moment.
# All seven run in Higgsfield's cloud sandbox, so even the free ones upload the clip.
# They cover the first 60 seconds, at 1080x1920 and 30 fps, and they add their own
# grain, grade and sound effects. Run them on the graded, uncaptioned picture with
# --no-finish, then import the result as a new source, so Altocue's own caption,
# mix and master stages still see it. Stacked, one matte is shared by all of them.

[[recipe]]
id = "text-behind"
title = "Word behind the head"
group = "reel"
command = "/text-behind"
makes = "Sets a spoken key word behind the speaker's head, as on a magazine cover."
when = "A talking head needs one word to land hard and a card over the face would be wrong."
inputs = ["one vertical talking clip", "a key word of up to 24 characters"]
limits = "First 60 seconds. Up to 12 moments of 2.2 s each. The head should cover about a third of the word, never the feet of letters."
enters_at = "finish"
tool = "remove_background, then sandbox_exec"
loader = "get_preset_instructions"
load = "/text-behind"
uploads_footage = true
sends = "the clip, to Higgsfield's sandbox"
basis = "observed"
as_of = "2026-10-08"
fixed_credits = 1
cost_note = "One matte, seen once on a 10 s 720p clip. The price for a 60 s clip is unknown, and remove_background has no cost preflight."
fallback = "none"
fallback_note = "Needs a matte and a composite. Altocue has no composite stage yet, so a fal matte alone does not get there."

