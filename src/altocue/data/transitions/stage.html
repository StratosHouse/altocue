<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' data: blob:">
<style>html,body{margin:0;background:#000}#stage{position:absolute;inset:0;width:100%;height:100%;display:block}</style></head>
<body><div id="root" data-composition-id="root" data-start="0" data-duration="{{seconds}}" data-width="{{width}}" data-height="{{height}}" style="position:relative;width:{{width}}px;height:{{height}}px;overflow:hidden">
<canvas id="stage" width="{{width}}" height="{{height}}"></canvas>
</div>
<script>
const FRAMES = {{frames}}, FPS = {{fps}}, WIDTH = {{width}}, HEIGHT = {{height}}, BODY = {{body}};
const gl = document.getElementById("stage").getContext("webgl", {preserveDrawingBuffer: true, alpha: false, antialias: false});
const HEAD = "precision highp float;varying vec2 _uv;uniform sampler2D from,to;uniform float progress,ratio;vec4 getFromColor(vec2 uv){return texture2D(from,uv);}vec4 getToColor(vec2 uv){return texture2D(to,uv);}";
function compile(kind, text) {
  const shader = gl.createShader(kind);
  gl.shaderSource(shader, text);
  gl.compileShader(shader);
  return shader;
}
const program = gl.createProgram();
gl.attachShader(program, compile(gl.VERTEX_SHADER, "attribute vec2 pos;varying vec2 _uv;void main(){_uv=pos*.5+.5;gl_Position=vec4(pos,0.,1.);}"));
gl.attachShader(program, compile(gl.FRAGMENT_SHADER, HEAD + "\n" + BODY + "\nvoid main(){gl_FragColor=transition(_uv);}"));
gl.linkProgram(program);
gl.useProgram(program);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
const place = gl.getAttribLocation(program, "pos");
gl.enableVertexAttribArray(place);
gl.vertexAttribPointer(place, 2, gl.FLOAT, false, 0, 0);
gl.uniform1f(gl.getUniformLocation(program, "ratio"), WIDTH / HEIGHT);
gl.uniform1i(gl.getUniformLocation(program, "from"), 0);
gl.uniform1i(gl.getUniformLocation(program, "to"), 1);
gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
gl.pixelStorei(gl.UNPACK_COLORSPACE_CONVERSION_WEBGL, gl.NONE);
for (const unit of [0, 1]) {
  gl.activeTexture(gl.TEXTURE0 + unit);
  gl.bindTexture(gl.TEXTURE_2D, gl.createTexture());
  for (const [key, value] of [[gl.TEXTURE_MIN_FILTER, gl.LINEAR], [gl.TEXTURE_MAG_FILTER, gl.LINEAR], [gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE], [gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE]]) gl.texParameteri(gl.TEXTURE_2D, key, value);
}
const progress = gl.getUniformLocation(program, "progress");
function still(side, index) {
  return new Promise((done, failed) => {
    const image = new Image();
    image.onload = () => done(image);
    image.onerror = failed;
    image.src = side + "/" + String(index + 1).padStart(4, "0") + ".png";
  });
}
async function draw(time) {
  const index = Math.min(FRAMES - 1, Math.max(0, Math.round(time * FPS)));
  const [a, b] = await Promise.all([still("a", index), still("b", index)]);
  gl.activeTexture(gl.TEXTURE0);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, a);
  gl.activeTexture(gl.TEXTURE1);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, b);
  gl.uniform1f(progress, (index + 1) / (FRAMES + 1));
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.finish();
}
window.addEventListener("hf-seek", (event) => event.detail.waitUntil(draw(event.detail.time)));
</script>
</body></html>
