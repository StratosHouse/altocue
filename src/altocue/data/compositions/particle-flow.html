<!doctype html>
<html>
  <body>
    <template>
      <style>
        #particle-flow-root { position: absolute; inset: 0; overflow: hidden; }
        #particle-flow-root canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      </style>
      <div id="particle-flow-root" data-composition-id="particle-flow" data-width="1920" data-height="1080">
        <canvas id="particle-flow-canvas"></canvas>
      </div>
      <script>
        (function () {
          // Particles flying towards the camera. Every position is worked out from time alone, so any frame can be drawn first.
          var root = document.getElementById("particle-flow-root");
          var canvas = document.getElementById("particle-flow-canvas");
          var context = canvas.getContext("2d");
          var width = (canvas.width = Number(root.getAttribute("data-width")) || 1920);
          var height = (canvas.height = Number(root.getAttribute("data-height")) || 1080);
          var seed = 41;
          function random() {
            seed = (seed + 0x6d2b79f5) | 0;
            var mixed = Math.imul(seed ^ (seed >>> 15), 1 | seed);
            mixed = (mixed + Math.imul(mixed ^ (mixed >>> 7), 61 | mixed)) ^ mixed;
            return ((mixed ^ (mixed >>> 14)) >>> 0) / 4294967296;
          }
          var count = 900;
          var motes = [];
          for (var index = 0; index < count; index += 1) {
            motes.push({ angle: random() * Math.PI * 2, reach: 0.12 + random() * 0.95, depth: random(), speed: 0.1 + random() * 0.06, hot: random() < 0.16 });
          }
          var style = getComputedStyle(root);
          var accent = (style.getPropertyValue("--accent") || "#ffffff").trim();
          var ink = (style.getPropertyValue("--ink") || "#ffffff").trim();
          function draw(time) {
            context.clearRect(0, 0, width, height);
            var middleX = width / 2;
            var middleY = height / 2;
            var span = Math.max(width, height) * 0.62;
            for (var index = 0; index < count; index += 1) {
              var mote = motes[index];
              var depth = (mote.depth + time * mote.speed) % 1;
              var near = depth * depth * depth;
              var distance = mote.reach * span * (0.04 + near * 2.2);
              var turn = mote.angle + time * 0.05;
              var x = middleX + Math.cos(turn) * distance;
              var y = middleY + Math.sin(turn) * distance * 0.72;
              var size = 0.8 + near * 7;
              context.globalAlpha = Math.min(depth * 1.8, 1) * (1 - near * 0.4);
              context.fillStyle = mote.hot ? accent : ink;
              var tail = near * 26;
              context.beginPath();
              context.moveTo(x, y);
              context.lineTo(x - Math.cos(turn) * tail, y - Math.sin(turn) * tail);
              context.lineWidth = size;
              context.strokeStyle = context.fillStyle;
              context.lineCap = "round";
              context.stroke();
            }
            context.globalAlpha = 1;
          }
          // The renderer announces each frame's time, and that time is the only input. No timeline, no clock.
          window.addEventListener("hf-seek", function (event) {
            draw(event.detail.time);
          });
          draw(window.__hfThreeTime || 0);
        })();
      </script>
    </template>
  </body>
</html>
