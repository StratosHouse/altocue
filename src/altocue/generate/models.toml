# Altocue model catalog. This file is the only place a model id, a price or a
# request field name may live. Vendors retire video APIs without warning, so a
# change here must never need a code release.
#
# A route is provider + surface + tier + capability. There is at most one, and a
# shot that has no route is an error with a suggestion, never a quiet swap to
# another model. Surface is empty for a route Altocue runs itself. `surface = "mcp"`
# is a route only an agent can drive, through the provider's MCP server: Altocue
# quotes it and imports the result, and a run never picks it. Model ids differ by
# surface, so a CLI id here says nothing about the MCP id, or the other way round.
#
# Capabilities: text_to_video, image_to_video, reference_to_video,
# frame_and_refs_to_video, text_to_image, reference_to_image.
#
# A `motion` field is a route that takes a motion video, such as a blockout that sets
# camera and timing. Only routes whose own docs list a video reference have one, and
# a shot with a motion video is refused everywhere else. `usd_per_second_video_ref`
# prices the motion video's seconds and the output's together, as fal bills them.
#
# Prices are USD for 1 output. `usd_per_second` is read from the provider's own
# model page. A route with `price = "cli"` asks the provider's tool at run time.
# Override the whole file for one project with `models = "path.toml"` under
# [generate] in altocue.toml.
#
# Known price conflict, read 2026-10-30: fal's Kling 3.0 model page says $0.112
# per second and its pricing page says $0.14. Kling is left out of the default
# routes until that is settled.

schema = 1

[providers.fal]
label = "fal.ai"
terms_url = "https://fal.ai/terms"
terms_as_of = "2026-09-08"
queue_url = "https://queue.fal.run"
rest_url = "https://rest.fal.ai"
poll_seconds = 3.0
destination = "fal.ai storage, on a public link until it expires (anyone with the URL can download it)"
source_url = "https://fal.ai/docs/documentation/model-apis/fal-cdn"

[providers.higgsfield]
label = "Higgsfield"
terms_url = "https://higgsfield.ai/terms-of-use-agreement"
terms_as_of = "2026-10-23"
labels_note = "Keep every AI label, watermark and provenance mark. Higgsfield's terms (5.5) bar removing or obscuring them, and you disclose AI output where the law asks."
upload_warning = """\
Higgsfield's terms, updated 2026-10-23, let it train its models on what you upload and what it makes, unless you hold an Enterprise Agreement (section 4.4). \
Deleting a file stops future use, but anything already used stays in trained models (16.5). \
Faces, voices and client footage need the owner's agreement first (4.2, 5.3)."""
poll_seconds = 3.0
destination = "Higgsfield, through its CLI"
# Higgsfield bills plan credits. Its plans tool, read 2026-11-02, showed $0.033 a
# credit on an annual Ultra plan ($99 for 3,000) and $0.0526 to $0.0588 on top-ups.
# This default stays above all of them, so the spend cap errs safe. Set your own
# with `usd_per_credit` under [generate]: plan price divided by plan credits.
usd_per_credit = 0.08
usd_per_credit_as_of = "2026-11-02"
usd_per_credit_source = "https://higgsfield.ai/mcp"
source_url = "https://github.com/higgsfield-ai/cli"

# fal: Seedance 2.0 Mini. Draft tier, 720p.

[[model]]
provider = "fal"
tier = "draft"
capability = "text_to_video"
kind = "video"
model = "bytedance/seedance-2.0/mini/text-to-video"
params = { resolution = "720p" }
fields = { duration = "duration", aspect = "aspect_ratio", audio = "generate_audio" }
duration_format = "{}"
aspects = ["21:9", "16:9", "4:3", "1:1", "3:4", "9:16"]
min_duration = 4
max_duration = 15
max_images = 0
usd_per_second = 0.1547
as_of = "2026-10-30"
source_url = "https://fal.ai/models/bytedance/seedance-2.0/mini/text-to-video/llms.txt"

[[model]]
provider = "fal"
tier = "draft"
capability = "image_to_video"
kind = "video"
model = "bytedance/seedance-2.0/mini/image-to-video"
params = { resolution = "720p" }
fields = { duration = "duration", aspect = "aspect_ratio", audio = "generate_audio", first_frame = "image_url", last_frame = "end_image_url" }
duration_format = "{}"
aspects = ["21:9", "16:9", "4:3", "1:1", "3:4", "9:16"]
min_duration = 4
max_duration = 15
max_images = 2
usd_per_second = 0.1547
as_of = "2026-10-30"
source_url = "https://fal.ai/models/bytedance/seedance-2.0/mini/image-to-video/llms.txt"

[[model]]
provider = "fal"
tier = "draft"
capability = "reference_to_video"
kind = "video"
model = "bytedance/seedance-2.0/mini/reference-to-video"
params = { resolution = "720p" }
fields = { duration = "duration", aspect = "aspect_ratio", audio = "generate_audio", refs = "image_urls", motion = "video_urls" }
duration_format = "{}"
aspects = ["21:9", "16:9", "4:3", "1:1", "3:4", "9:16"]
min_duration = 4
max_duration = 15
max_images = 9
motion_seconds = [2, 15]
usd_per_second_video_ref = 0.0928
usd_per_second = 0.1547
note = "fal bills this route per token and lists no per-second rate. It is the Mini token rate, the same as the 720p image route. With a motion video, the Mini rate drops from $0.007 to $0.0042 per 1,000 tokens, billed on the motion video and the output together (page read 2026-11-03)."
as_of = "2026-10-30"
source_url = "https://fal.ai/models/bytedance/seedance-2.0/mini/reference-to-video/llms.txt"

