# What the weekly sweep watches. `uv run python scripts/sweep.py` reports what moved. Nothing here installs anything.
#
# role = "used"       Altocue runs it today. A pinned one is measured against its pin.
# role = "candidate"  Worth a look, not adopted. Measured against `seen`, the release a person last read.
# pin                 An exact pin that lives outside pyproject.toml and the renderer's package.json.
# seen                The release a person last read the notes and licence of. Update it when you have.
# licence             The licence a person read in the project's own files. The sweep says when upstream states another.
#
# Add an entry only after reading the licence file itself. A package page is not the licence.

# Speech to text

[[watch]]
name = "parakeet-mlx"
where = "pypi"
id = "parakeet-mlx"
role = "used"
licence = "Apache-2.0"
why = "Default speech engine on Apple Silicon"

[[watch]]
name = "faster-whisper"
where = "pypi"
id = "faster-whisper"
role = "used"
licence = "MIT"
why = "Default speech engine everywhere else"

[[watch]]
name = "mlx-whisper"
where = "pypi"
id = "mlx-whisper"
role = "used"
licence = "MIT"
why = "Optional speech engine on Apple Silicon"

[[watch]]
name = "onnx-asr"
where = "pypi"
id = "onnx-asr"
role = "candidate"
licence = "MIT"
seen = "0.12.0"
why = "Could run the default Mac speech model on Linux and NVIDIA machines"

[[watch]]
name = "mlx-audio"
where = "pypi"
id = "mlx-audio"
role = "candidate"
licence = "MIT"
