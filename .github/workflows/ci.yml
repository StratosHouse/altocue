name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg tesseract-ocr
      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Build the package the way the release does
        run: |
          uv build
          uv run --no-project python -c "import glob, sys, zipfile; names = zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist(); sys.exit(0 if 'altocue/data/skills/altocue/SKILL.md' in names else 'The wheel is missing the skills.')"
      - run: uv sync
      - run: uv run ruff check src tests scripts
      - run: uv run pytest
      - run: uv run python scripts/check_repo.py
        env:
          ALTOCUE_BLOCKLIST: ${{ secrets.ALTOCUE_BLOCKLIST }}
