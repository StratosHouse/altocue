name: Library sync

on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: uv sync
      - name: Install the pinned renderer
        working-directory: src/altocue/data/renderer
        run: npm ci --ignore-scripts
      - name: Rebuild the catalog
        run: uv run python scripts/build_library.py
        env:
          ALTOCUE_RENDERER_DIR: ${{ github.workspace }}/src/altocue/data/renderer
      - name: Check the source addresses
        run: uv run python scripts/build_library.py --check-links >> "$GITHUB_STEP_SUMMARY"
      - run: uv run pytest tests/test_library.py -q
      - run: uv run python scripts/check_repo.py
        env:
          ALTOCUE_BLOCKLIST: ${{ secrets.ALTOCUE_BLOCKLIST }}
      - name: Commit if the catalog changed
        run: |
          git add library src/altocue/data/library
          if git diff --cached --quiet; then
            echo "The catalog did not change." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync the library catalog"
          git pull --rebase origin main
          git push origin HEAD:main
