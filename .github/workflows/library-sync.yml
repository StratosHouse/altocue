name: Library sync

on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: uv sync
      - name: Install the pinned renderer
        working-directory: src/altocue/data/renderer
        run: npm ci --ignore-scripts
      - name: Rebuild the catalog
        run: uv run python scripts/build_library.py
        env:
          ALTOCUE_RENDERER_DIR: ${{ github.workspace }}/src/altocue/data/renderer
      - name: Check the source addresses
        run: uv run python scripts/build_library.py --check-links >> "$GITHUB_STEP_SUMMARY"
      - name: Report what moved upstream
        run: uv run python scripts/sweep.py >> "$GITHUB_STEP_SUMMARY"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: uv run pytest tests/test_library.py tests/test_sweep.py -q
      - run: uv run python scripts/check_repo.py
        env:
          ALTOCUE_BLOCKLIST: ${{ secrets.ALTOCUE_BLOCKLIST }}
      # A person reviews every change before it reaches main, and `library update` reads main.
      - name: Open a pull request if the catalog changed
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: library-sync
        run: |
          git add library src/altocue/data/library
          if git diff --cached --quiet; then
            echo "The catalog did not change." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git commit -m "Sync the library catalog"
          git push --force origin "HEAD:refs/heads/$BRANCH"
          if [ "$(gh pr view "$BRANCH" --json state --jq .state 2>/dev/null)" = "OPEN" ]; then
            echo "Updated the open pull request from $BRANCH." >> "$GITHUB_STEP_SUMMARY"
          else
            gh pr create --base main --head "$BRANCH" --title "Sync the library catalog" \
              --body "The weekly library sync rebuilt the catalog. Read the diff before merging: \`library update\` hands main to every user."
          fi
